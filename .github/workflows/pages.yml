# Deploy the public site from docs/: the landing page (index.html), the interactive visual (viz/zero_torus.html)
# and the report (report/weil_windows_report_v1.pdf). Runs on every push to main that touches docs/.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the site's pages are present
        run: |
          for f in docs/index.html docs/viz/zero_torus.html docs/report/weil_windows_report_v1.pdf; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
